# Baker 1031 Investments — Netlify configuration
# Build: Opportunities tool feed + content sources -> static pages (python3 build/build.py). Auth: serverless function + edge gate.
# Offerings, past performance and preferred sponsors come from https://opportunities.baker1031.com (public feed);
# that tool fires NETLIFY_BUILD_HOOK automatically about a minute after any change there.
#
# Required environment variables (Site configuration -> Environment variables):
#   OPPORTUNITIES_FEED_KEY  the Opportunities tool's FEED_KEY — lets the build download offering documents
#   SESSION_SECRET       long random string (e.g. `openssl rand -hex 32`); shared by the auth function and the edge gate
#   NETLIFY_BUILD_HOOK   this site's build hook URL (Build & deploy -> Build hooks) — used by the rebuild watcher backstop
#   CRM_SHARED_KEY       same value as on the CRM project; every function talks to the CRM (POST https://crm.baker1031.com/api/site)
# The site runs on the CRM (crm.baker1031.com): login, registrations, update links, bookings, reminders and portal access
#   all live there, and investors.baker1031.com manages portal accounts on top of the same data. This is pinned here —
#   no request asks the CRM which system to use. Registrations go only to the CRM; one the CRM cannot take is kept in the
#   Netlify Blobs store "pending-leads" and re-sent every 5 minutes by lead-retry; after 24 h of failures it is emailed
#   to jerry@ (RESEND_API_KEY; LEAD_ALERT_TO overrides the address). Blobs needs no setup or variable.
#   CRM_BACKEND = attio   emergency switch back to Attio + the Airtable investor table (needs ATTIO_API_KEY, AIRTABLE_TOKEN)
#   CRM_BACKEND = switch  follow the CRM's Settings -> Website switch again (one request per cold start)
#   Optional: CRM_SITE_URL, CRM_EVENTS_URL override the addresses.
# Optional, only for the CRM_BACKEND=attio emergency path (and the CRM's one-time import through /api/crm-export):
#   AIRTABLE_TOKEN       personal access token — data.records:read+write on Investor Access. Not used for offerings or performance.
# Attio (emergency path only): ATTIO_API_KEY; optional ATTIO_DEAL_OWNER, ATTIO_DEAL_STAGE, ATTIO_REVIEW_STAGE, ATTIO_LIST,
#   ATTIO_DEALS=off, ATTIO_WEBHOOK_SECRET (portal-sync webhook signature)
#   A first offering view moves the open deal to "Reviewing Opportunities" by default (forward-only).
#   ATTIO_REVIEW_STAGE changes the target or, set to "off", disables it; ATTIO_PROMOTE_FROM narrows the source stages.
# Email / misc: RESEND_API_KEY, PORTAL_SYNC_KEY, SCHEDULE_CALL_URL, CRS_RECEIPT_TO
# Booking (Cal.com): CAL_WEBHOOK_SECRET — the signing secret on the Cal.com "Booking created" webhook
#   pointed at /api/booked. Without it a booking still moves the deal and notes it on the person, but it
#   cannot grant portal access: the endpoint is public, so an unsigned call is not proof of a booking.
#   Optional: ATTIO_BOOKED_STAGE (default "Intro Call Scheduled")
# Optional (defaults are baked in): AIRTABLE_BASE, AIRTABLE_TABLE, ACCESS_BASE_ID, ACCESS_TABLE_ID, SESSION_DAYS

[build]
  publish = "."
  command = "python3 build/build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"

# Production is main only; any other branch gets a preview URL that must never be indexed.
[context.branch-deploy.environment]
  ROBOTS_NOINDEX = "true"
[context.deploy-preview.environment]
  ROBOTS_NOINDEX = "true"

# Daily 1031 deadline reminders (8am PT): reads Airtable dates, emails via Resend, logs to the row's "Reminder Log".
# On the CRM (the default) it stands down: the CRM sends the reminders.
[functions."deadline-reminders"]
  schedule = "0 15 * * *"

# Hourly: reconcile investor access between Attio and Airtable in whichever direction was edited last.
# On the CRM (the default) it stands down: portal access lives only in the CRM.
# Airtable can also call /api/access-sync directly from an automation for an instant push; this is the
# backstop so a flip in either system is never left stranded.
[functions."access-sync"]
  schedule = "17 * * * *"

# Every 5 minutes: re-send registrations the CRM missed (Netlify Blobs store "pending-leads"), delete each once the CRM
# confirms it, and email jerry@ any still failing after 24 hours.
[functions."lead-retry"]
  schedule = "*/5 * * * *"

# Every 15 minutes (backstop): rebuild if an offering changed in the Opportunities tool since the last publish
# (compares the feed's newest updatedAt vs /build-info.json, then POSTs NETLIFY_BUILD_HOOK).
[functions."rebuild-watcher"]
  schedule = "*/15 * * * *"

# Friendly API paths for the browser.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
[[redirects]]
  from = "/api/login-link"
  to = "/.netlify/functions/login-link"
  status = 200
[[redirects]]
  from = "/api/crm-link"
  to = "/.netlify/functions/crm-link"
  status = 200
[[redirects]]
  from = "/api/crm-export"
  to = "/.netlify/functions/crm-export"
  status = 200
[[redirects]]
  from = "/api/my-info"
  to = "/.netlify/functions/my-info"
  status = 200
[[redirects]]
  from = "/api/portal-sync"
  to = "/.netlify/functions/portal-sync"
  status = 200
[[redirects]]
  from = "/api/access-sync"
  to = "/.netlify/functions/access-sync"
  status = 200
# Cal.com's "Booking created" webhook posts here; the register form posts here too, with less privilege.
[[redirects]]
  from = "/api/booked"
  to = "/.netlify/functions/booked"
  status = 200
[[redirects]]
  from = "/api/reminders-off"
  to = "/.netlify/functions/reminders-off"
  status = 200
# Manual runs of the scheduled jobs: POST /api/deadline-reminders?key=<PORTAL_SYNC_KEY>&dry=1 (report only)
[[redirects]]
  from = "/api/deadline-reminders"
  to = "/.netlify/functions/deadline-reminders"
  status = 200
[[redirects]]
  from = "/api/rebuild-watcher"
  to = "/.netlify/functions/rebuild-watcher"
  status = 200

# The lead check-in pages (the personal links in Jerry's check-in emails and texts to leads who registered but didn't book).
# They live on the platform (app.baker1031.com, src/app/check-in); this keeps the links on baker1031.com. Public in the edge gate.
[[redirects]]
  from = "/check-in/*"
  to = "https://app.baker1031.com/check-in/:splat"
  status = 200
  force = true

# Friendly aliases. Old-site URLs (/offerings/, /request-access/, /performance/, /current-offerings/…) are
# 301-redirected by the edge gate (netlify/edge-functions/gate.js), which sees every request first.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/form-crs"
  to = "/assets/docs/aurora-form-crs.pdf"
  status = 301
[[redirects]]
  from = "/form-crs/"
  to = "/assets/docs/aurora-form-crs.pdf"
  status = 301

# The gate runs on every path; its own allowlist decides what is public. It hard-gates /offerings/<slug>/docs/.
[[edge_functions]]
  path = "/*"
  function = "gate"

# Long-cache static assets; HTML revalidates every request.
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/sponsors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/offerings/*/docs/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
# Security headers (no change to how pages render)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
